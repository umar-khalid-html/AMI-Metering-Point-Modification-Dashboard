<!DOCTYPE html>
<html>
<head>
  <title>AMI Meter Modification Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; padding:30px; }
    .card { display:inline-block; background:#fff; border-radius:8px; padding:20px 30px;
             margin:10px; box-shadow:0 1px 4px rgba(0,0,0,.1); text-align:center; }
    .label { color:#2E5A9C; font-weight:bold; font-size:14px; }
    .value { color:#1F3864; font-size:28px; font-weight:bold; margin-top:6px; }
  </style>
</head>
<body>
  <h2 style="color:#1F3864;">AMI Meter Modification — Live Dashboard</h2>
  <div id="cards"></div>
  <script>
    const SHEET_ID = "<iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT3fBp1CwH0tgOxmyTBOFG5XkYz1JTiXqOhxbu6jMjKlmI8CFmaJflZviKUy5e_9buj4EAaq1bt4_HD/pubhtml?gid=514306027&amp;single=true&amp;widget=true&amp;headers=false"></iframe>"; // from the Sheet's URL
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Dashboard`;

    fetch(url)
      .then(r => r.text())
      .then(text => {
        const json = JSON.parse(text.substring(47).slice(0, -2)); // strips Google's JS wrapper
        const rows = json.table.rows;
        // Dashboard!B4:F5 = labels row then values row
        const labels = rows[0].c.map(c => c && c.v);
        const values = rows[1].c.map(c => c && c.v);
        const cardsDiv = document.getElementById("cards");
        labels.forEach((label, i) => {
          if (!label) return;
          cardsDiv.innerHTML += `<div class="card"><div class="label">${label}</div>
            <div class="value">${values[i]}</div></div>`;
        });
      });
  </script>
</body>
</html>
